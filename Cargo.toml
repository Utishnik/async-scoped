[package]
name = "async-scoped"
version = "0.9.0"
authors = ["Rajsekar Manokaran <rajsekar@gmail.com>"]
edition = "2018"

documentation = "https://docs.rs/async-scoped"
description = "Spawn scoped (non 'static) asynchronous futures for smol and tokio runtimes"
homepage = "https://github.com/rmanoka/async-scoped"
repository = "https://github.com/rmanoka/async-scoped"
readme = "README.md"

categories = [ "asynchronous", "concurrency" ]
keywords = [ "async", "smol", "tokio", "compio", "scoped", "spawn" ]
license = "Apache-2.0/MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pin-project = "1.0"
smol = { version = "2.0", optional = true }
smol-macros = { version = "0.1.1", optional = true }
futures = { version = "0.3.15", features = ["thread-pool"] }
tokio = {version = "1.0", features = ["rt-multi-thread", "macros", "sync"], optional = true}
compio = { version = "0.14", optional = true, features = ["runtime", "macros"] }

[features]
# Verify package.metadata.docs.rs when updating
use-smol = ["smol", "dep:smol-macros"]
use-tokio = ["tokio"]
# compio is cross-platform (Linux, Windows, macOS, *BSD, ...), so this
# feature is not gated on any target.
use-compio = ["dep:compio"]


[dev-dependencies]
femme = "2.2.1"
futures-timer = "3.0"
log = { version = "0.4.20", features = ["kv_unstable"] }
smol = "2.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
compio = { version = "0.14", features = ["runtime", "macros"] }

[package.metadata.docs.rs]
features = ["use-smol", "use-tokio", "use-compio"]

[[bench]]
name = "spawner"
path = "benches/spawner.rs"
harness = false
